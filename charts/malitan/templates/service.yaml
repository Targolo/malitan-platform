apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "malitan.selectorLabels" . | nindent 4 }}
  name: {{ .Release.Name }}
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    {{- include "malitan.selectorLabels" . | nindent 4 }}
  type: ClusterIP

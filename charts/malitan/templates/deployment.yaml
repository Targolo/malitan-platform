apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "malitan.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "malitan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "malitan.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      volumes:
      - name: {{ .Release.Name }}-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
      containers:
      - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        name: {{ .Release.Name }}
        ports:
        - name: http
          containerPort: 5001
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret }}
              key: AUTH_SECRET_KEY
        volumeMounts:
        - mountPath: /data
          name: {{ .Release.Name }}-data
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        livenessProbe:
          httpGet:
            path: /livez
            port: http
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      initContainers:
      - name: init-db
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        command: ["flask", "init-db"]
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret }}
              key: AUTH_SECRET_KEY
        volumeMounts:
        - mountPath: /data
          name: {{ .Release.Name }}-data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
  strategy:
    type: Recreate

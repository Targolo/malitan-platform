apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "malitan.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "malitan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "malitan.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
      - name: {{ .Release.Name }}-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
      containers:
      - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        name: {{ .Release.Name }}
        ports:
        - name: http
          containerPort: 5001
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret }}
              key: AUTH_SECRET_KEY
        volumeMounts:
        - mountPath: /data
          name: {{ .Release.Name }}-data
      initContainers:
      - name: init-db
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        command: ["flask", "init-db"]
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.existingSecret }}
              key: AUTH_SECRET_KEY
        volumeMounts:
        - mountPath: /data
          name: {{ .Release.Name }}-data
  strategy:
    type: Recreate

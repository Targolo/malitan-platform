apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    {{- include "malitan.selectorLabels" . | nindent 4 }}
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ .Release.Name }}
            port:
              name: http
        path: /
        pathType: Prefix

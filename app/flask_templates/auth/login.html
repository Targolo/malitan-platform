<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Malitan 3D</title>
    {% if app_logo_path %}<link rel="icon" href="{{ url_for('static', filename=app_logo_path) }}">{% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=app_version) }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <div class="logo-icon">M3</div>
            <div>
                <h1>{{ app_name or 'Malitan 3D' }}</h1>
                <p>Connexion à l'espace de gestion</p>
            </div>
        </div>
        {% if error %}
        <div class="login-error" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </main>
</body>
</html>

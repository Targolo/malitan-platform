{% from 'macros/icons.html' import icon %}
<div class="modal-header">
    <h2>{{ icon('plus') }} Ajouter du stock - {{ color.nom }}</h2>
</div>

<div class="modal-body">
<div style="padding: 20px; background: var(--bg); border-radius: 8px; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <p style="margin: 0; color: var(--text-secondary); font-size: var(--text-sm);">Stock actuel</p>
            <p style="margin: 5px 0 0 0; font-size: var(--text-xl); font-weight: 600;">{{ color.stock_grammes|int }}g</p>
        </div>
        {% if color.code_hex %}
        <span class="color-badge" style="background-color: {{ color.code_hex }}; width: 40px; height: 40px;"></span>
        {% endif %}
    </div>
</div>

<form 
    hx-post="{{ url_for('color_add_stock', color_id=color.id) }}"
    hx-target="body"
    hx-swap="beforeend"
    class="catalog-form">
    
    <div class="form-group">
        <label for="quantite">Quantité à ajouter (grammes) *</label>
        <input type="number" class="form-control" id="quantite" name="quantite" 
               value="0" min="0" step="100" required autofocus>
        <small class="form-text text-muted">Quantité en grammes à ajouter au stock actuel</small>
    </div>
    
    <div class="form-group">
        <label for="observations">Observations</label>
        <input type="text" class="form-control" id="observations" name="observations" 
               placeholder="Ex: Nouvelle bobine, Réception fournisseur...">
    </div>
    
    <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeColorModal()">{{ icon('x') }} Annuler</button>
        <button type="submit" class="btn btn-primary">{{ icon('plus') }} Ajouter</button>
    </div>
</form>
</div>

permissions:
  contents: read
name: malitan_ci
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/malitan_ci.yaml"
  pull_request:
    branches: [main]  
    paths:
      - "app/**"
      - ".github/workflows/malitan_ci.yaml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run tests
        run: uv run --locked pytest  -m "not ui"
        working-directory: ./app
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run tests
        run: uv run --locked pytest  -m "ui"
        working-directory: ./app
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run lint
        run: uv run --locked ruff check
        working-directory: ./app
  build:
    needs: [test, test-ui, lint]
    permissions: { contents: read, packages: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the Python version
        id: python
        run: echo "version=$(cat app/.python-version)" >> "$GITHUB_OUTPUT"

      - name: build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags:  ghcr.io/targolo/malitan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

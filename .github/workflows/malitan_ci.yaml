permissions:
  contents: read
name: malitan_ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run tests
        run: uv run --locked pytest  -m "not ui"
        working-directory: ./app
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run tests
        run: uv run --locked pytest  -m "ui"
        working-directory: ./app
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: run lint
        run: uv run --locked ruff check
        working-directory: ./app
